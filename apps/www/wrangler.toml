name = "mdly-garden"
main = "worker/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain — the deploy target (D2/R45). Must be a top-level key
# (before any [table] header) or TOML folds it into the preceding table.
# Deployed at garden.theindie.app via `wrangler deploy`.
routes = [
	{ pattern = "garden.theindie.app", custom_domain = true }
]

# The Vite SPA build output. The Worker serves these as static assets and
# only runs first for the API routes below — mirrors apps/notion-web exactly
# (R46).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Session + workspace-registry store: session-id (httpOnly cookie) -> stored
# session; also holds the "workspace-registry" JSON blob (R28/R33). A Worker
# fully separate from apps/notion-web's own SESSIONS namespace (R47) — this
# id is the live production namespace serving garden.theindie.app.
[[kv_namespaces]]
binding = "SESSIONS"
id = "c15721990d2f4c568a8ea539243f5161"

# Content-addressed asset + (Phase 2) version bytes: key = `assets/<sha256>`.
# Live bucket bound to this Worker in production (serves garden.theindie.app).
[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "mdly-garden-assets"

# One Durable Object instance per workspace (SQLite storage).
[[durable_objects.bindings]]
name = "WORKSPACE_DO"
class_name = "WorkspaceDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDurableObject"]

# Nightly orphan-asset GC (R5) — same time-of-day as the old Convex cron.
#
# DISARMED 2026-09-03. The old matcher only counted a markdown image reference
# when a path segment ended in `.assets`, but `POST /api/assets` accepts any
# path and the desktop asset walker uploads images from anywhere in the
# workspace — so referenced images in plain folders were marked, tombstoned,
# and deleted from R2 (and the tombstone then deleted the local original).
# Fixed round 6: reachability is now a raw-content containment check over
# every live note's text (canonical, raw, percent-encoded and backslash forms
# of the stored path — no folder-name gate, no syntax enumeration), and the
# stored row path is canonicalised before comparing so legacy rows match.
# A deletion decision fails toward keeping data.
#
# Re-enable ONLY after review says so — see .brief-do-fix-round-5.md and
# .brief-do-fix-round-6.md. The [triggers] block below stays commented out.
# [triggers]
# crons = ["0 4 * * *"]

# Secrets (set via `wrangler secret put`, not committed):
#   APP_PASSWORD — the single shared login password (R38, R41).
